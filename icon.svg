<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#26262b"/>
      <stop offset="1" stop-color="#0c0c0e"/>
    </linearGradient>
  </defs>
  <!-- full-bleed background (safe for maskable) -->
  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- script "text lines" -->
  <g fill="#e9e9ee">
    <rect x="120" y="150" width="272" height="26" rx="13"/>
    <rect x="120" y="206" width="220" height="26" rx="13" opacity="0.82"/>
  </g>
  <!-- the reading line (red) with the active line of text -->
  <rect x="96" y="256" width="320" height="4" rx="2" fill="#ff3b30"/>
  <rect x="120" y="270" width="256" height="30" rx="15" fill="#ffffff"/>
  <g fill="#e9e9ee">
    <rect x="120" y="330" width="200" height="26" rx="13" opacity="0.6"/>
    <rect x="120" y="386" width="150" height="26" rx="13" opacity="0.4"/>
  </g>
  <!-- record dot -->
  <circle cx="392" cy="388" r="26" fill="#ff3b30"/>
</svg>
